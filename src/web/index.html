<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turntable</title><style>:root{--b:#121212;--s:#1E1E1E;--s2:#252525;--t:#E0E0E0;--td:#888;--a:#F59E0B;--d:#EF4444;--br:#333}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}*{box-sizing:border-box}.c{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;gap:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--br);padding-bottom:15px}h1{margin:0;font-size:1.2rem;color:var(--td)}.dot{width:10px;height:10px;border-radius:50%;background:var(--d);transition:.3s}.dot.on{background:#10B981;box-shadow:0 0 8px #10B981}.p{background:var(--s);border:1px solid var(--br);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:15px}.lbl{font-size:.75rem;text-transform:uppercase;color:var(--td);display:block;margin-bottom:5px}.rpm{font-family:monospace;font-size:3rem;font-weight:700;color:var(--a);text-align:center}.rng{width:100%;height:40px;display:flex;align-items:center}input[type=range]{-webkit-appearance:none;width:100%;background:0 0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:24px;width:24px;border-radius:50%;background:var(--a);margin-top:-10px}input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:var(--s2)}.tgl{display:flex;background:var(--s2);border-radius:6px;padding:4px}.tb{flex:1;background:0 0;border:0;color:var(--td);padding:10px;border-radius:4px;cursor:pointer}.tb.act{background:var(--a);color:#000}.row{display:grid;grid-template-columns:1fr auto;gap:10px}input[type=number]{background:var(--b);border:1px solid var(--br);color:var(--t);padding:12px;border-radius:6px;font-family:monospace;width:100%}button{border:0;border-radius:6px;padding:12px;font-weight:600;cursor:pointer;display:flex;justify-content:center;align-items:center}.btn-p{background:var(--a);color:#000}.btn-s{background:var(--s2);color:var(--t);border:1px solid var(--br)}.btn-d{background:var(--d);color:#fff;width:100%;padding:20px;font-size:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}.chp{background:var(--s2);border:1px solid var(--br);color:var(--td);padding:8px;border-radius:4px;text-align:center;cursor:pointer;font-size:.9rem}.chp:hover{border-color:var(--a);color:var(--t)}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--br);margin-bottom:15px}.tab{padding-bottom:8px;color:var(--td);cursor:pointer;border-bottom:2px solid transparent}.tab.act{color:var(--a);border-bottom-color:var(--a)}.bar{font-family:monospace;font-size:.8rem;color:var(--td);display:flex;justify-content:space-between;margin-top:auto}.prg{width:100%;height:4px;background:var(--s2);margin-top:10px;display:none}.prg-in{height:100%;background:var(--a);width:0%}.rot .prg{display:block}.hide{display:none}.seq{background:#f59e0b1a;border:1px solid #925f07;padding:10px;border-radius:6px;margin-top:10px}.ck{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.9rem}input[type=checkbox]{accent-color:var(--a)}</style></head><body><div class="c"><header><h1>Turntable <span style="color:var(--a)">//</span></h1><div id="conn" class="dot" title="Disconnected"></div></header><div class="p"><div><span class="lbl">Speed (RPM)</span><div class="rpm" id="rv">1.0</div><div class="rng"><input type="range" id="sl" min="0.5" max="5.0" step="0.1" value="1.0"></div></div><div><span class="lbl">Direction</span><div class="tgl"><button class="tb" id="bccw" onclick="setDir('ccw')">CCW ↺</button><button class="tb act" id="bcw" onclick="setDir('cw')">CW ↻</button></div></div></div><div class="p"><div class="tabs"><div class="tab act" onclick="mod('man')">Manual</div><div class="tab" onclick="mod('pho')">Photo</div><div class="tab" onclick="mod('vid')">Video</div></div><div id="m-man" class="mc"><span class="lbl">Angle</span><div class="grid"><div class="chp" onclick="ang(30)">30°</div><div class="chp" onclick="ang(45)">45°</div><div class="chp" onclick="ang(90)">90°</div><div class="chp" onclick="ang(180)">180°</div><div class="chp" onclick="ang(360)">360°</div></div><br><div class="row"><input type="number" id="inp" value="90"><button class="btn-p" onclick="rot()">ROTATE</button></div></div><div id="m-pho" class="mc hide"><span class="lbl">Preset</span><div class="grid"><div class="chp" onclick="seq(36,10)">36x</div><div class="chp" onclick="seq(72,5)">72x</div><div class="chp" onclick="seq(4,90)">4x</div></div><div class="seq"><div class="ck"><input type="checkbox" id="cp" checked><label>Pause</label></div><div class="row"><div><span class="lbl">Step</span><span id="si" style="font-family:monospace">10°</span></div><button style="background:0;border:1px solid var(--a);color:var(--a)" id="bs" onclick="goSeq()">START</button></div></div><div id="ss" class="hide" style="text-align:center;margin-top:10px;color:var(--a);font-weight:700">Shot <span id="sc">0</span> / <span id="st">0</span><br><button class="btn-p" id="bn" onclick="nxt()" style="width:100%;margin-top:8px">NEXT</button></div></div><div id="m-vid" class="mc hide"><p style="color:var(--td);font-size:.9rem">Continuous Rotation</p><div class="row"><button class="btn-s" onclick="spd(0.5)">Slow</button><button class="btn-s" onclick="spd(2.0)">Fast</button></div><br><button class="btn-p" style="width:100%" onclick="cont()">START</button></div><div id="fb" class="prg"><div class="prg-in" id="pb"></div></div></div><button class="btn-d" onclick="halt()">STOP</button><div class="bar"><span id="txt">IDLE</span><span id="at">0°</span></div></div><script>let s={r:1.0,d:'cw',rot:false,a:0,q:null};const E={r:document.getElementById('rv'),sl:document.getElementById('sl'),i:document.getElementById('inp'),t:document.getElementById('txt'),at:document.getElementById('at'),p:document.getElementById('pb'),fb:document.getElementById('fb'),c:document.getElementById('conn'),bs:document.getElementById('bs'),ss:document.getElementById('ss'),bn:document.getElementById('bn')};function init(){E.sl.addEventListener('input',e=>{s.r=parseFloat(e.target.value);E.r.textContent=s.r.toFixed(1)});E.sl.addEventListener('change',()=>api('speed',{rpm:s.r}));E.c.classList.add('on')}async function api(e,d){try{await fetch('/api/'+e,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});E.c.classList.add('on')}catch(x){E.c.classList.remove('on')}}function setDir(d){s.d=d;document.getElementById('bcw').classList.toggle('act',d==='cw');document.getElementById('bccw').classList.toggle('act',d==='ccw')}function spd(v){s.r=v;E.sl.value=v;E.r.textContent=v.toFixed(1);api('speed',{rpm:v})}function ang(v){E.i.value=v}function mod(m){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));event.target.classList.add('act');document.querySelectorAll('.mc').forEach(c=>c.classList.add('hide'));document.getElementById('m-'+m).classList.remove('hide')}async function rot(){if(s.rot)return;const d=parseInt(E.i.value);if(!d)return;stat('ROTATING...');anim(d);await api('rotate',{degrees:d,direction:s.d})}async function cont(){stat('CONTINUOUS');E.fb.classList.add('rot');E.p.style.width='100%';await api('continuous',{direction:s.d})}async function halt(){if(s.q)endSeq();E.fb.classList.remove('rot');E.p.style.width='0%';stat('STOPPED');await api('stop')}function seq(n,d){s.q={t:n,c:0,s:d,p:document.getElementById('cp').checked};document.getElementById('si').textContent=d+'°';E.ss.style.display='none';E.bs.style.display='block'}function endSeq(){s.q=null;E.ss.style.display='none';E.bs.style.display='block';E.bn.style.display='none'}async function goSeq(){if(!s.q)seq(36,10);s.q.p=document.getElementById('cp').checked;E.bs.style.display='none';E.ss.style.display='block';nxt()}async function nxt(){if(!s.q)return;s.q.c++;document.getElementById('sc').textContent=s.q.c;document.getElementById('st').textContent=s.q.t;E.bn.style.display='none';stat('SHOT '+s.q.c);step(s.q.s);await api('rotate',{degrees:s.q.s,direction:s.d});if(s.q.c>=s.q.t){stat('DONE');endSeq();return}if(s.q.p){E.bn.style.display='inline-block';stat('WAITING')}else{setTimeout(nxt,2000)}}function step(d){const t=(d/360)*(60/s.r);anim(d)}function stat(m){E.t.textContent=m;s.rot=m.includes('ROTATING')||m.includes('CONTINUOUS')}function anim(d,cb){E.fb.classList.add('rot');E.p.style.width='0%';E.p.style.transition='none';const t=(d/360)*(60/s.r);requestAnimationFrame(()=>{E.p.style.transition='width '+t+'s linear';E.p.style.width='100%'});setTimeout(()=>{E.fb.classList.remove('rot');s.a+=(s.d==='cw'?d:-d);E.at.textContent=Math.abs(s.a)+'°';if(cb)cb();else stat('IDLE')},t*1000)}init()</script></body></html>
